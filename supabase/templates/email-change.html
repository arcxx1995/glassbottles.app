<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <meta name="supported-color-schemes" content="dark" />
    <title>Confirm your new glassbottles email</title>
    <!-- Playfair Display: renders in Apple/iOS Mail; Gmail/Outlook fall back to Georgia serif. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet" />
    <style>
      /* Progressive enhancement only — email is fully legible without this. */
      @media only screen and (max-width: 600px) {
        .gb-card { padding: 28px 22px !important; }
        .gb-h1 { font-size: 22px !important; }
      }
    </style>
  </head>
  <body style="margin:0; padding:0; background-color:#0A1628; -webkit-text-size-adjust:100%; -ms-text-size-adjust:100%;">
    <!-- Preheader: hidden preview text -->
    <div style="display:none; max-height:0; overflow:hidden; opacity:0; color:#0A1628; font-size:1px; line-height:1px;">
      Confirm your new email address to update it.
    </div>

    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#0A1628;">
      <tr>
        <td align="center" style="padding:40px 16px;">
          <!-- 600px content frame -->
          <table role="presentation" width="600" cellpadding="0" cellspacing="0" border="0" style="width:600px; max-width:600px;">

            <!-- Brand mark -->
            <tr>
              <td align="center" style="padding:0 0 24px 0;">
                <img src="https://glassbottles.app/email/glassbottles-wordmark.png"
                     width="116" height="26" alt="glassbottles"
                     style="display:block; border:0; outline:none; text-decoration:none; height:26px; width:116px;" />
              </td>
            </tr>

            <!-- Card -->
            <tr>
              <td class="gb-card" style="background-color:#0D2137; border-radius:16px; padding:40px 40px;">
                <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">

                  <tr>
                    <td style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
                      <h1 class="gb-h1" style="margin:0 0 14px 0; font-family:'Playfair Display',Georgia,'Times New Roman',serif; font-size:28px; line-height:1.25; font-weight:400; color:#F7E7CE;">
                        Charting a new course.
                      </h1>
                      <p style="margin:0 0 12px 0; font-size:15px; line-height:1.6; color:#F7E7CE;">
                        Confirm your new email address to update it.
                      </p>
                      <p style="margin:0 0 28px 0; font-size:14px; line-height:1.6; color:rgba(247,231,206,0.5);">
                        New address: <span style="color:#F7E7CE;">{{ .NewEmail }}</span>
                      </p>
                    </td>
                  </tr>

                  <!-- CTA button -->
                  <tr>
                    <td style="padding:0 0 28px 0;">
                      <table role="presentation" cellpadding="0" cellspacing="0" border="0">
                        <tr>
                          <td align="center" style="background-color:#4ECDC4; border-radius:10px;">
                            <a href="{{ .SiteURL }}/auth/callback?token_hash={{ .TokenHash }}&type=email_change&next=/settings"
                               style="display:inline-block; padding:14px 32px; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif; font-size:15px; font-weight:600; color:#0A1628; text-decoration:none;">
                              Confirm new email
                            </a>
                          </td>
                        </tr>
                      </table>
                    </td>
                  </tr>

                  <!-- Expiry note -->
                  <tr>
                    <td style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
                      <p style="margin:0; font-size:13px; line-height:1.5; color:rgba(247,231,206,0.5);">
                        This link expires in 1 hour.
                      </p>
                    </td>
                  </tr>

                </table>
              </td>
            </tr>

            <!-- Footer -->
            <tr>
              <td style="padding:24px 8px 0 8px; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
                <p style="margin:0; font-size:12px; line-height:1.6; color:rgba(247,231,206,0.5);">
                  If you didn&rsquo;t request this, you can safely ignore this email.
                </p>
              </td>
            </tr>

          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
